<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Argon</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <aside>
    <div id="space-name" title="Double-click to rename"></div>
    <hr>
    <div id="kept" class="list" data-empty="Drag tabs here to keep them"></div>
    <hr>
    <div id="loose-zone">
      <div id="loose" class="list"></div>
      <div class="new-row">
        <button id="new">+ New</button>
        <button id="clear" title="Close every loose tab in this space">Clear</button>
      </div>
    </div>
  </aside>

  <div id="pill">
    <div class="dots" aria-hidden="true"></div>
    <nav aria-label="Spaces"></nav>
  </div>

  <div id="cmd" hidden>
    <section aria-label="Command bar">
      <input id="q" spellcheck="false" autocomplete="off" aria-label="Command">
      <div id="results" role="listbox"></div>
      <div class="hint"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
    </section>
  </div>

  <div id="toast" hidden><span></span><button>Undo ⌘Z</button></div>

  <template id="row">
    <div class="row" draggable="true">
      <button class="open"><img alt=""><span class="title"></span></button>
      <span class="timer"></span>
      <button class="x" aria-label="Close tab" title="Close · ⌥W">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </template>
  <script type="module" src="panel.js"></script>
</body>
</html>
