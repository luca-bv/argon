<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Arc quick window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5fb3}a:hover{color:#1f4386}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 760px; height: 480px; box-sizing: border-box; padding: 40px; background: #d8d8de; font-family: Inter, system-ui, sans-serif; color: #1c1c1e; display: flex; align-items: center; justify-content: center">
<div style="width: 640px; height: 400px; border-radius: 12px; overflow: hidden; background: #e8e2f4; box-shadow: 0 18px 50px rgba(0,0,0,0.25); display: flex; flex-direction: column; padding: 6px; gap: 6px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
<span style="margin-left: 8px; font-size: 13px; color: #4f4f57; flex-grow: 1">github.com/imputnet/helium/issues</span>
<button style="border: 0; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; background: #6a4fb3; color: #fff; min-height: 32px">Open in Argon space</button>
</div>
<div style="flex: 1; border-radius: 8px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); padding: 28px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 12px; color: #4f4f57">A link opened from another app lands here, not in a full window</p>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Issues · imputnet/helium</h1>
<div aria-hidden="true" style="height: 12px; width: 100%; border-radius: 6px; background: #ececef"></div>
<div aria-hidden="true" style="height: 12px; width: 88%; border-radius: 6px; background: #ececef"></div>
<div aria-hidden="true" style="height: 12px; width: 64%; border-radius: 6px; background: #ececef"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
